<!-- Cookie banner and analytics, as on sidecartridge.com
     (sidecartridge-website: _includes/framework/cookie-consent.html and
     google-analytics.html). https://github.com/orestbida/cookieconsent v2.9.2,
     MIT, inlined from src/vendor/. The privacy and contact links point at the
     main site instead of placeholders.
     Shared consent: cookieconsent writes cc_cookie with Domain=<cookie_domain>,
     and its default is location.hostname, so sidecartridge.com's cookie already
     covers every subdomain. This page sets cookie_domain to sidecartridge.com
     too, so both read and write the same cookie; elsewhere (localhost, LAN)
     it keeps the default. -->
<style>
{{COOKIE_CSS}}
</style>
<script>
{{COOKIE_JS}}
</script>
<script>
    window.addEventListener('load', function () {

        // obtain plugin
        var cc = initCookieConsent();

        // run plugin with your configuration
        cc.run({
            cookie_domain: /(^|\.)sidecartridge\.com$/.test(location.hostname) ? 'sidecartridge.com' : location.hostname,
            current_lang: 'en',
            autoclear_cookies: true,                   // default: false
            page_scripts: true,                        // default: false

            onFirstAction: function (user_preferences, cookie) {
                // callback triggered only once on the first accept/reject action
            },

            onAccept: function (cookie) {
                // callback triggered on the first accept/reject action, and after each page load
            },

            onChange: function (cookie, changed_preferences) {
                // If analytics category is disabled => disable google analytics
                if (!cc.allowedCategory('analytics')) {
                    typeof gtag === 'function' && gtag('consent', 'update', {
                        'analytics_storage': 'denied'
                    });
                }
            },

            languages: {
                'en': {
                    consent_modal: {
                        title: 'We use cookies!',
                        description: 'Hi, this website uses essential cookies to ensure its proper operation and tracking cookies to understand how you interact with it. The latter will be set only after consent. <button type="button" data-cc="c-settings" class="cc-link">Let me choose</button>',
                        primary_btn: {
                            text: 'Accept all',
                            role: 'accept_all'              // 'accept_selected' or 'accept_all'
                        },
                        secondary_btn: {
                            text: 'Reject all',
                            role: 'accept_necessary'        // 'settings' or 'accept_necessary'
                        }
                    },
                    settings_modal: {
                        title: 'Cookie preferences',
                        save_settings_btn: 'Save settings',
                        accept_all_btn: 'Accept all',
                        reject_all_btn: 'Reject all',
                        close_btn_label: 'Close',
                        cookie_table_headers: [
                            { col1: 'Name' },
                            { col2: 'Domain' },
                            { col3: 'Expiration' },
                            { col4: 'Description' }
                        ],
                        blocks: [
                            {
                                title: 'Cookie usage 📢',
                                description: 'I use cookies to ensure the basic functionalities of the website and to enhance your online experience. You can choose for each category to opt-in/out whenever you want. For more details relative to cookies and other sensitive data, please read the full <a href="https://sidecartridge.com/privacy-policy/" class="cc-link" target="_blank" rel="noopener">privacy policy</a>.'
                            }, {
                                title: 'Strictly necessary cookies',
                                description: 'These cookies are essential for the proper functioning of my website. Without these cookies, the website would not work properly',
                                toggle: {
                                    value: 'necessary',
                                    enabled: true,
                                    readonly: true          // cookie categories with readonly=true are all treated as "necessary cookies"
                                },
                                cookie_table: [
                                    {
                                        col1: 'cc_cookie',
                                        col2: '.sidecartridge.com',
                                        col3: '6 months',
                                        col4: 'Stores your cookie choice for sidecartridge.com and its subdomains.'
                                    }
                                ]
                            }, {
                                title: 'Performance and Analytics cookies',
                                description: 'Google Analytics 4 cookies, used to understand how visitors use the site. Only set if you accept this category.',
                                toggle: {
                                    value: 'analytics',     // your cookie category
                                    enabled: false,
                                    readonly: false
                                },
                                cookie_table: [             // list of all expected cookies
                                    {
                                        col1: '_ga',
                                        col2: '.sidecartridge.com',
                                        col3: '2 years',
                                        col4: 'Google Analytics 4: distinguishes visitors.'
                                    },
                                    {
                                        col1: '_ga_6VT9RXTJ2N',
                                        col2: '.sidecartridge.com',
                                        col3: '2 years',
                                        col4: 'Google Analytics 4: keeps the session state.'
                                    }
                                ]
                            },
                            {
                                title: 'More information',
                                description: 'For any queries in relation to our policy on cookies and your choices, please <a class="cc-link" href="https://sidecartridge.com/" target="_blank" rel="noopener">contact us</a>.',
                            }
                        ]
                    }
                }
            }
        });
    });
</script>
<!-- Google Analytics, the sidecartridge.com property. cookieconsent runs
     this only after the analytics category is accepted (page_scripts), and it
     only loads gtag on *.sidecartridge.com, so local and LAN tests send no hits.
     gtag's default cookie_domain 'auto' puts _ga on .sidecartridge.com, shared
     with the main site. -->
<script type="text/plain" data-cookiecategory="analytics">
    (function () {
        var GA_ID = 'G-6VT9RXTJ2N';
        if (!/(^|\.)sidecartridge\.com$/.test(location.hostname)) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag('js', new Date());
        gtag('config', GA_ID);
    })();
</script>
